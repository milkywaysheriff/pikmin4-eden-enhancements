name: Verify release packaging
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build and check patch combinations
        run: python3 tools/build_release.py
      - name: Check publication and archive guards
        run: python3 -m unittest discover -s tests -v
